# 把仓库关联的 GHCR 包切成 public（一次性/按需工具）。
#
# 为什么需要它：GHCR 新包默认 **private**，而部署节点匿名拉不动 ⇒ 只能源码构建。
# 网页改（Package settings → Change visibility）或 classic PAT 都能改，
# 但 **CLI 的 OAuth token（gho_）与 GITHUB_TOKEN 在 user 级包上恒返回 404**
# （GitHub 对这类端点只认 classic PAT）—— 组织包则由**本仓库的 workflow token** 试。
name: pkg-visibility
on:
  workflow_dispatch:
    inputs:
      visibility:
        description: '目标可见性（public / private）'
        required: true
        default: 'public'
permissions:
  packages: write
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: 改包可见性（组织包用 orgs 路由）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIS: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          echo "== 改前 =="; gh api "/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/textin" --jq '.visibility'
          gh api -X PATCH "/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/textin" -f visibility="$VIS"
          echo "== 改后 =="; gh api "/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/textin" --jq '.visibility'
